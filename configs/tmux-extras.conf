# micromux extras — keybindings only, sourced by the micromux launcher.
# Safe to source multiple times.

# Alt+arrows (works in most terminals)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# F9 toggles between panes (with 2 panes = toggle)
bind -n F9  select-pane -t :.+

# Vim-style fallback
bind -n M-j select-pane -D
bind -n M-k select-pane -U

# F10 zooms current pane fullscreen (toggle)
bind -n F10 resize-pane -Z

