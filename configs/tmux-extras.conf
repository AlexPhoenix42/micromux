# micromux extras — keybindings only, sourced by the micromux launcher.
# Safe to source multiple times.

# Alt+Left/Right for horizontal pane navigation
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R

# Alt+j / Alt+k for reliable vertical pane navigation
bind -n M-j select-pane -D
bind -n M-k select-pane -U

# F9 toggles between panes (with 2 panes = toggle)
bind -n F9 select-pane -t :.+

# F10 toggles fullscreen for the current pane
bind -n F10 resize-pane -Z

# F12: quit micromux — kills the whole session (with confirmation)
bind -n F12 confirm-before -p "Quit micromux? (y/n) " kill-session

